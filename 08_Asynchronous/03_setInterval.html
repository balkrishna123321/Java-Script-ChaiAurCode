<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>setInterval 2</title>
</head>
<body>
    <h1>hello Interval</h1>
    <button id="start">Start</button>
    <button id="stop">Stop</button>
</body>     
<script>
    setInterval(function(){
        console.log("bk", Date.now())
    }, 100000)

    //can take this function in variable and also can give third parameter (input string) to the setInterval function
    const nameDate = function(str){
        console.log(str, Date.now())
    }
    let intervalId;
    document.querySelector('#start').addEventListener('click', function(){
        intervalId = setInterval(nameDate, 2000, "bkk")
    })
    document.querySelector('#stop').addEventListener('click', function(){
        clearInterval(intervalId)

    })

    
</script>
</html>
